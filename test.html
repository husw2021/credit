        // --- Drawing Helpers ---
        function drawButton(text, x, y, width, height, color = '#007AFF', textColor = '#FFFFFF', borderColor = null, fontSize = 16) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            if (borderColor) {
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, width, height);
            }
            ctx.fillStyle = textColor;
            ctx.font = `${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + width / 2, y + height / 2);
            return { x, y, width, height };
        }

        function drawText(text, x, y, color = '#FFFFFF', fontSize = 16, textAlign = 'left', textBaseline = 'top') {
            ctx.fillStyle = color;
            ctx.font = `${fontSize}px Arial`;
            ctx.textAlign = textAlign;
            ctx.textBaseline = textBaseline;
            ctx.fillText(text, x, y);
        }
        
        function drawMultilineText(text, x, y, maxWidth, lineHeight, color = '#FFFFFF', fontSize = 12, textAlign = 'left') {
            ctx.fillStyle = color;
            ctx.font = `${fontSize}px Arial`;
            ctx.textAlign = textAlign;
            ctx.textBaseline = 'top';

            const words = String(text).split(' '); 
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            return currentY + lineHeight - y; 
        }

        function drawRect(x, y, width, height, color = '#555', strokeColor = null) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, width, height);
            }
        }

        function drawBadgeCard(badge, x, y, width, height) {
            drawRect(x, y, width, height, '#4a4a4a', '#666');
            drawRect(x + 10, y + 10, 60, 60, '#777'); 
            drawText(badge.visual || "徽章图", x + 40, y + 40, '#ccc', 12, 'center', 'middle');
            drawText(badge.name, x + 80, y + 15, '#FFF', 16);
            drawText(badge.issuer || `颁发者: ${badge.status}`, x + 80, y + 40, '#bbb', 12); 
            if (badge.expiresAt) { 
                 drawText("有效", x + width - 40, y + height - 20, 'lightgreen', 10, 'center');
            } else if (badge.status) { 
                 drawText(badge.status, x + width - 45, y + height - 20, badge.status === '激活' ? 'lightgreen' : 'orange', 10, 'center');
            }
            return { x, y, width, height, id: badge.id };
        }
        
        function wrapText(text, maxWidth, context, fontSize) {
            const words = String(text).split(' ');
            const lines = [];
            let currentLine = words[0] || ""; 
            context.font = `${fontSize}px Arial`;

            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // --- Loading Indicator ---
        function drawLoadingIndicator() { /* ... (unchanged) ... */ 
            drawRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT, 'rgba(0,0,0,0.7)');

        // --- Modal Drawing ---
        function drawModal() { /* ... (unchanged) ... */ 
            modalClickableAreas = [];
            drawRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT, 'rgba(0,0,0,0.7)');
            const modalWidth = CANVAS_WIDTH * 0.8;
            const modalHeightMin = 150; 
            const modalPadding = 20;
            const titleHeight = 30;
            const buttonHeight = 40;
            const buttonSpacing = 10;
            ctx.font = '14px Arial';
            const lines = wrapText(modalConfig.message, modalWidth - 2 * modalPadding, ctx, 14);
            const textBlockHeight = lines.length * 18; 
            let modalContentHeight = titleHeight + textBlockHeight + (modalConfig.actions.length > 0 ? buttonHeight + buttonSpacing : 0) + 2 * modalPadding;
            if (modalConfig.actions.length > 0) modalContentHeight += modalPadding; 
            let dynamicModalHeight = Math.max(modalHeightMin, modalContentHeight);
            dynamicModalHeight = Math.min(dynamicModalHeight, CANVAS_HEIGHT * 0.8); 
            const modalX = (CANVAS_WIDTH - modalWidth) / 2;
            const modalY = (CANVAS_HEIGHT - dynamicModalHeight) / 2;
            drawRect(modalX, modalY, modalWidth, dynamicModalHeight, '#444', '#666');
            drawText(modalConfig.title, modalX + modalWidth / 2, modalY + modalPadding + titleHeight/2, '#FFF', 18, 'center', 'middle');
            let textY = modalY + modalPadding + titleHeight + 10;
            const maxTextHeight = dynamicModalHeight - (titleHeight + (modalConfig.actions.length > 0 ? buttonHeight + buttonSpacing : 0) + 3 * modalPadding);
            ctx.save();
            ctx.beginPath();
            ctx.rect(modalX + modalPadding, textY, modalWidth - 2 * modalPadding, maxTextHeight);
            ctx.clip();
            drawMultilineText(modalConfig.message, modalX + modalPadding, textY, modalWidth - 2 * modalPadding, 18, '#DDD', 14);
            ctx.restore();
            if (modalConfig.actions.length > 0) {
                const totalButtonWidth = (modalConfig.actions.length * (100 + buttonSpacing)) - buttonSpacing;
                let startX = modalX + (modalWidth - totalButtonWidth) / 2;
                const buttonY = modalY + dynamicModalHeight - modalPadding - buttonHeight;
                modalConfig.actions.forEach(action => {
                    const btnArea = drawButton(action.text, startX, buttonY, 100, buttonHeight, action.color || '#007AFF', '#FFF', null, 14);
                    modalClickableAreas.push({ ...btnArea, action: action.action });
                    startX += 100 + buttonSpacing;
                });
            }
        }
        
        // --- Temporary Message ---
        function showTemporaryMessage(text, duration = 2000, color = 'lightgreen') { /* ... (unchanged) ... */ 
            temporaryMessage.text = text;
            temporaryMessage.expires = Date.now() + duration;
            temporaryMessage.color = color;
            mainDraw(); 
        }

        function drawTemporaryMessage() { /* ... (unchanged) ... */ 
            if (temporaryMessage.text && Date.now() < temporaryMessage.expires) {
                const msgWidth = ctx.measureText(temporaryMessage.text).width + 40;
                const msgHeight = 40;
                const msgX = (CANVAS_WIDTH - msgWidth) / 2;
                const msgY = CANVAS_HEIGHT - TAB_BAR_HEIGHT - msgHeight - 10; 
                drawRect(msgX, msgY, msgWidth, msgHeight, 'rgba(0,0,0,0.8)');
                drawText(temporaryMessage.text, CANVAS_WIDTH / 2, msgY + msgHeight / 2, temporaryMessage.color, 14, 'center', 'middle');
            } else if (temporaryMessage.text && Date.now() >= temporaryMessage.expires) {
                temporaryMessage.text = ""; 
                mainDraw(); 
            }
        }

        // --- Modal and Loading Controls ---
        function showLoading(message = "Loading...") { /* ... (unchanged) ... */ 
            isLoading = true; loadingMessage = message; mainDraw(); 
        }
        function hideLoading() { /* ... (unchanged) ... */ 
            isLoading = false; mainDraw(); 
        }
        function showModal(title, message, actions = []) { /* ... (unchanged) ... */ 
            isModalVisible = true; modalConfig = { title, message, actions }; mainDraw(); 
        }
        function hideModal() { /* ... (unchanged) ... */ 
            isModalVisible = false; mainDraw(); 
        }

        // --- Clipboard Helper ---
        function copyToClipboard(text) { /* ... (unchanged) ... */ 
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; 
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showTemporaryMessage("Copied to clipboard!", 2000);
                } else {
                    showTemporaryMessage("Copy failed. Sad操!", 2000, 'orange');
                }
            } catch (err) {
                showTemporaryMessage("Error copying. WTF!", 2000, 'red');
            }
            document.body.removeChild(textarea);
        }

        // --- Gemini API Integration ---
        async function generateTextWithGemini(prompt, onSuccess, onError, onFinally) { /* ... (unchanged) ... */ 
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`); }
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts.length > 0) {
                    const text = result.candidates[0].content.parts[0].text;
                    if (onSuccess) onSuccess(text);
                } else { throw new Error("No content found in Gemini response. WTF, API?!?"); }
            } catch (error) { if (onError) onError(error.message || "Unknown error calling Gemini. It's fucked."); } 
            finally { if (onFinally) onFinally(); }
        }

        function handleSuggestSharePost() { /* ... (unchanged) ... */ 
            if (!selectedBadge) return;
            const prompt = `Generate a short, enthusiastic social media post for sharing a new digital badge. I want to share it with my friends and colleagues.
Badge Name: "${selectedBadge.name}"
Issued by: "${selectedBadge.issuer}"
Description: "${selectedBadge.description}"
Make it sound exciting and proud! Include a couple of relevant hashtags. Keep it under 280 characters.`;
            showLoading("✨ Generating post suggestion...");
            generateTextWithGemini(prompt, (generatedText) => {
                showModal("✨ Suggested Post", generatedText, [ { text: "Copy", action: () => { copyToClipboard(generatedText); }, color: '#07C160' }, { text: "Close", action: hideModal } ]);
            }, (errorMessage) => {
                showModal("API Error", `Failed to generate post: ${errorMessage}. Try again, maybe?`, [{ text: "Close", action: hideModal }]);
            }, hideLoading);
        }

        function handleGenerateBio() { /* ... (unchanged) ... */ 
            if (!currentUser) return;
            const prompt = `Generate a short, fun, and engaging user bio for a profile on a digital badge platform. The user's nickname is "${currentUser.nickname}".
The bio should be 2-3 sentences long, highlighting enthusiasm for learning and achievements. Make it sound cool and approachable.`;
            showLoading("✨ Generating bio...");
            generateTextWithGemini(prompt, (generatedText) => {
                showModal("✨ Suggested Bio", generatedText, [
                    { text: "Use Bio", action: () => { currentUser.bio = generatedText; hideModal(); mainDraw(); showTemporaryMessage("Bio updated! Looking good!", 2000); }, color: '#007AFF' },
                    { text: "Copy", action: () => { copyToClipboard(generatedText); }, color: '#07C160' },
                    { text: "Close", action: hideModal }
                ]);
            }, (errorMessage) => {
                showModal("API Error", `Failed to generate bio: ${errorMessage}. Shit happens.`, [{ text: "Close", action: hideModal }]);
            }, hideLoading);
        }

        // --- Main Draw Loop ---
        function mainDraw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            debugInfoEl.textContent = `Page: ${currentPage}, Role: ${currentRole || 'None'}${currentUser ? ", User: " + currentUser.nickname : ""}`;

            if (isLoading) {
                drawLoadingIndicator();
            } else if (isModalVisible) {
                drawModal();
            } else {
                 drawCurrentPage();
            }
            drawTemporaryMessage();
        }
        
        function drawCurrentPage(){
            switch (currentPage) {
                case 'login': drawLoginPage(); break;
                case 'roleSelection': drawRoleSelectionPage(); break; // New page for role selection
                case 'dashboardRecipient': drawDashboardRecipientPage(); break;
                case 'dashboardAdmin': drawDashboardAdminPage(); break;
                case 'myBadges': drawMyBadgesPage(); break;
                case 'badgeDetail': drawBadgeDetailPage(); break;
                case 'userProfile': drawUserProfilePage(); break;
                
                case 'orgAdmin': drawOrgAdminPage(); break;
                case 'editOrgInfo': drawEditOrgInfoPage(); break;
                case 'templateAdmin': drawTemplateAdminPage(); break;
                case 'createEditTemplate': drawCreateEditTemplatePage(); break;
                case 'issueBadge': drawIssueBadgePage(); break;
                
                case 'badgeVerificationInput': drawBadgeVerificationInputPage(); break;
                case 'badgeVerificationResult': drawBadgeVerificationResultPage(); break;

                default: drawText(`操，页面 ${currentPage} 丢了！`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 'red', 20, 'center', 'middle');
            }
        }

        // --- Click Event Handling ---
        canvas.addEventListener('click', function(event) { /* ... (unchanged) ... */ 
            if (isLoading && !isModalVisible) return; 
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            let areasToCheck = clickableAreas; 
            if (isModalVisible) { areasToCheck = modalClickableAreas; }
            for (const area of areasToCheck) {
                if (x >= area.x && x <= area.x + area.width && y >= area.y && y <= area.y + area.height) {
                    if (area.action) { area.action(); return; }
                }
            }
        });

        // --- Initialization ---
        mainDraw();
        console.log("操，Zo's Canvas应用 (带角色选择版) 初始化完毕！");

    </script>
